[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toolbridge"
version = "0.1.0"
description = "ToolBridge – Enterprise Model Context Protocol (MCP) Gateway"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "ToolBridge Engineering Team" }
]
keywords = ["mcp", "model-context-protocol", "gateway", "ai", "fastapi", "llm-security"]
dependencies = [
    "mcp[cli]>=2.3.0",
    "mcp-types>=2.3.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "sqlparse>=0.5.0",
    "jsonschema>=4.23.0",
    "greenlet>=3.1.0",
    "streamlit>=1.40.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "anyio>=4.6.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
toolbridge = "toolbridge.server.gateway:main"
toolbridge-api = "toolbridge.api.app:main"
toolbridge-dashboard = "toolbridge.dashboard.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: Isolated unit tests",
    "integration: Subsystem integration tests",
    "security: Security and penetration tests",
]
